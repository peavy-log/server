[SERVICE]
  Flush 2

[INPUT]
  Name tcp
  Port 8001
  Format json
  Tag events
  Buffer_Size ${FLB_BUFFER_SIZE:-64}
  Chunk_Size ${FLB_CHUNK_SIZE:-16}
  Mem_Buf_Limit ${FLB_MEMORY_LIMIT:-512MB}

[FILTER]
  Name lua
  Match *
  script filters.lua
  call process_record

[FILTER]
  # Rewrite google logs from the events default to logs
  Name rewrite_tag
  Match events
  Rule severity ^(.+)$ logs false 
  # Default is 10MB; when exceeded, tcp.0 is paused and proxy connections are reset
  Emitter_Mem_Buf_Limit ${FLB_EMITTER_MEMORY_LIMIT:-128MB}

[OUTPUT]
  Name stackdriver
  Match logs
  Resource global
  Severity_key severity
  Autoformat_stackdriver_trace true
  Compress gzip

[OUTPUT]
  Name http
  Tls ${CLICKHOUSE_TLS:-off}
  Match events
  Host ${CLICKHOUSE_HOST:-clickhouse.clickhouse.svc}
  Port ${CLICKHOUSE_PORT:-8123}
  URI /?query=INSERT+INTO+peavy.events+FORMAT+JSONEachRow
  Format json_stream
  Json_date_key timestamp
  Json_date_format epoch
  Http_user ${CLICKHOUSE_USER:-default}
  Http_passwd ${CLICKHOUSE_PASSWORD:-default}
  # ClickHouse closes idle keep-alive connections before fluent-bit's 30s default
  net.keepalive_idle_timeout 5
  Retry_Limit 5
